[build-system]
requires = ["setuptools>=80.0.0", "wheel>=0.45.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kes-electrical-core"
version = "0.1.0"
description = "Standards-agnostic electrical engineering calculation core (loads, sources) shared across KES Electrical OS, Kamra BENAS, Kamra Climate OS, MEP and BMS products."
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Kamra Engineering Solutions" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ruff>=0.12.0,<1.0.0",
    "mypy>=1.16.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
]
markers = [
    "unit: Pure domain unit tests.",
    "golden: Independently verified engineering reference cases.",
    "regression: Approved project regression cases.",
]

[tool.coverage.run]
branch = true
source = ["kes_electrical_core"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["kes_electrical_core"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
