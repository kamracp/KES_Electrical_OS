# KES Electrical OS — security response headers (review finding F5).
# Install: sudo cp deployment/nginx/snippets/kes-security-headers.conf /etc/nginx/snippets/
# nginx does NOT inherit add_header into a location that sets an add_header of its own,
# so this snippet is included at server level AND inside every such location.
# Origins the built frontend loads: fonts.googleapis.com (stylesheet), fonts.gstatic.com (font files).
# Cloudflare Web Analytics is on for the zone (automatic setup): Cloudflare injects
# static.cloudflareinsights.com/beacon.min.js into every HTML answer and the beacon reports to
# cloudflareinsights.com, so both are allowed (founder decision 2026-09-22, option B: keep analytics).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
