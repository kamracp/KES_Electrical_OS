# KES Electrical OS — nginx site. Cloudflare (SSL/TLS mode "Automatic", effectively Full) in front;
# the origin serves 443 with a Let's Encrypt certificate, as every other site on this instance does.
# The 443 block and the 80->443 redirect below were written by Certbot and are kept here verbatim.
# Install: sudo cp deployment/nginx/electrical.kamraengineeringsolution.com.conf /etc/nginx/sites-available/
#          sudo ln -s /etc/nginx/sites-available/electrical.kamraengineeringsolution.com.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d electrical.kamraengineeringsolution.com --redirect   (first time only)
# Frontend build is rsynced to /var/www/kes-electrical-os (frontend/dist).

server {
    server_name electrical.kamraengineeringsolution.com;

    root /var/www/kes-electrical-os;
    index index.html;

    # Cloudflare terminates TLS; trust its forwarded scheme for redirects and cookies.
    set $forwarded_proto $http_x_forwarded_proto;
    if ($forwarded_proto = "") { set $forwarded_proto $scheme; }

    client_max_body_size 5m;

    # API → uvicorn on 127.0.0.1:8040 (see deployment/systemd/kes-electrical-os.service)
    location /api/ {
        proxy_pass http://127.0.0.1:8040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Hashed Vite assets: cache long, immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing (/cable-sizing, /fault-study): unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Baseline security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/kes-electrical-os.access.log;
    error_log  /var/log/nginx/kes-electrical-os.error.log warn;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/electrical.kamraengineeringsolution.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/electrical.kamraengineeringsolution.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = electrical.kamraengineeringsolution.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name electrical.kamraengineeringsolution.com;
    return 404; # managed by Certbot


}
