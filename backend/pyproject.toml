[build-system]
requires = ["setuptools>=80.0.0", "wheel>=0.45.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kes-electrical-os-backend"
version = "0.1.0"
description = "Standards-governed electrical engineering platform for Kamra Engineering Solutions"
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Kamra Engineering Solutions" }
]
dependencies = [
    "fastapi>=0.140.0,<1.0.0",
    "uvicorn[standard]>=0.51.0,<1.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "SQLAlchemy>=2.0.51,<2.1.0",
    "alembic>=1.18.5,<2.0.0",
    "psycopg[binary,pool]>=3.3.4,<4.0.0",
    "loguru>=0.7.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "httpx>=0.28.1,<1.0.0",
    "aiosqlite>=0.21.0,<1.0.0",
    "ruff>=0.12.0,<1.0.0",
    "mypy>=1.16.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "migrations*"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
]
markers = [
    "unit: Pure domain unit tests.",
    "golden: Independently verified engineering reference cases.",
    "api: FastAPI endpoint tests.",
    "persistence: Database and repository tests.",
    "integration: Cross-layer integration tests.",
    "regression: Approved project regression cases.",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/models/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "migrations/versions",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = [
    "migrations/",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
